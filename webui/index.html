<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23715be8'/%3E%3Cpath d='M18 43V26a8 8 0 0 1 16 0v12a6 6 0 0 0 12 0V21' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Noodle · Shared files</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('noodle-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
