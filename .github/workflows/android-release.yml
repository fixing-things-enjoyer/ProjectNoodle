name: Release APK

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version and signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag; each component must be 0–999.'; exit 1; }
          for secret_name in KEY_ALIAS KEY_PASSWORD STORE_PASSWORD SIGNING_KEYSTORE_BASE64; do
            [[ -n "${!secret_name}" ]] || { echo "Missing release secret: $secret_name"; exit 1; }
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noodle-release.jks"
          chmod 600 "$RUNNER_TEMP/noodle-release.jks"
          echo "STORE_FILE=$RUNNER_TEMP/noodle-release.jks" >> "$GITHUB_ENV"
          echo "NOODLE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - run: ./gradlew assembleRelease --console=plain
      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk "release/ProjectNoodle-${NOODLE_VERSION}.apk"
          cd release
          sha256sum "ProjectNoodle-${NOODLE_VERSION}.apk" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS --verify-tag --title "Project Noodle ${NOODLE_VERSION}" --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/noodle-release.jks"
