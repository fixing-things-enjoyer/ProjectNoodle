version: 2
updates:
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
